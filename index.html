body{background:var(--bg);color:var(--label);font-family:"Roboto Serif",Georgia,serif;font-optical-sizing:auto;font-size:17px;line-height:1.32;letter-spacing:0;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#scroller{position:fixed;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
.wrap{will-change:transform}
#ptr{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 6px);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--label2);font-size:12px;opacity:0;pointer-events:none;z-index:5}
#ptr .spin{width:22px;height:22px;border:2.5px solid var(--fill);border-top-color:var(--blue);border-radius:50%;transition:transform .1s linear}
#ptr.busy .spin{animation:ptrspin .7s linear infinite;transition:none}
@keyframes ptrspin{to{transform:rotate(360deg)}}
nav{z-index:10}
.wrap{max-width:500px;margin:0 auto;padding:0 16px 24px}
.top{display:flex;justify-content:flex-end;gap:6px;padding-top:22px;height:66px;align-items:center}
.icb{background:none;border:none;color:var(--blue);width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:18px}
.icb:active{opacity:.4}
.icb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h1{font-family:inherit;font-size:34px;font-weight:700;letter-spacing:-.3px;line-height:41px}
.sub{color:var(--label2);font-size:13px;margin:2px 0 18px}
.group{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:22px}
.pad{padding:14px 16px}
.hdr{font-size:13px;color:var(--label2);text-transform:uppercase;margin:0 16px 7px}
.foot-note{font-size:13px;color:var(--label2);margin:-15px 16px 22px}
.cell{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;padding:11px 16px;position:relative}
.cell+.cell::before,.cell+.det::before,.det+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell .l{min-width:0;flex:1}
.cell .r{text-align:right;white-space:nowrap}
.t1{font-size:17px}
.t2{font-size:15px;color:var(--label2)}
.t3{font-size:13px;color:var(--label2)}
.sb{font-weight:600}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--green)}.dn{color:var(--red)}
.cap{font-size:13px;color:var(--label2);}
.hero{font-family:inherit;font-size:40px;font-weight:700;letter-spacing:.2px;line-height:1.15;margin:2px 0 2px}
.chg{font-size:17px;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.tile{background:var(--card);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-size:20px;font-weight:600;letter-spacing:.38px;margin-top:3px}
.callout{background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;color:var(--label2);margin:-12px 0 22px}
.callout b{color:var(--label);font-weight:600}
.track{height:4px;background:var(--fill);border-radius:2px;margin-top:8px;overflow:hidden}
.track>i{display:block;height:100%;background:var(--blue);border-radius:2px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.split i{display:block;height:100%}
.abar{height:8px;background:var(--fill);border-radius:4px;margin-top:7px;overflow:hidden}
.abar>i{display:block;height:100%;border-radius:4px;min-width:5px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:0}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin-bottom:14px}
.seg button{flex:1;border:none;background:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--label);padding:6px 0;border-radius:7px}
.seg button.on{background:var(--seg);box-shadow:var(--shadow);font-weight:600}
.chev{width:8px;height:13px;margin-left:8px;stroke:var(--label3);fill:none;stroke-width:2;vertical-align:middle;transition:transform .2s}
.open-row .chev{transform:rotate(90deg)}
.det{display:none;background:var(--fill2);padding:4px 16px 8px;position:relative}
.det.open{display:block}
.kv{display:flex;justify-content:space-between;font-size:15px;padding:6px 0}
.kv span:first-child{color:var(--label2)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{background:var(--fill);border-radius:7px;padding:4px 8px;font-size:13px;}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;align-items:end;height:120px}
.months .col{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:1px}
.months .col i{display:block;border-radius:3px;min-height:3px;background:var(--fill)}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:6px;font-size:11px;color:var(--label3);text-align:center}
.legend{display:flex;gap:16px;font-size:13px;color:var(--label2);margin-top:12px}
.setup label{display:block;font-size:13px;color:var(--label2);text-transform:uppercase;margin:16px 16px 7px}
.setup input{width:100%;background:var(--card);border:none;border-radius:12px;padding:13px 16px;color:var(--label);font-size:17px;font-family:inherit;outline:none}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:15px;font-size:17px;font-weight:600;margin-top:22px;font-family:inherit}
.btn:active{opacity:.7}
.btn.plain{background:none;color:var(--blue);font-weight:400;margin-top:6px}
.err{color:var(--red);font-size:15px;margin:10px 16px 0;min-height:1em}
.empty{text-align:center;color:var(--label2);padding:60px 0}
.mask{letter-spacing:1px;color:var(--label3)}
.desc{font-size:13px;line-height:1.4;color:var(--label2);margin-top:8px}
.cell-desc{margin:0;padding:12px 16px 10px;position:relative}
.cell-desc+.cell::before,.cell-desc+.pad+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.tdesc{font-size:12px;color:var(--label2);margin-top:3px;line-height:1.3}
.acc-big{font-size:28px;font-weight:700;margin-top:6px}
.cur{font-size:max(.55em,10px);letter-spacing:.2px;margin-right:.5px}
.ct{font-size:max(.6em,11px)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;padding:7px 0 calc(2px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;color:#999;font-family:inherit;font-size:10px;font-weight:500;letter-spacing:.1px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 0 4px}
nav button svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--blue)}
nav button.on svg{stroke-width:2}
.view{display:none}.view.on{display:block}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px;background:var(--fill);color:var(--label2)}
.tag.neg{background:rgba(255,59,48,.14);color:var(--red)}
.tag.ok{background:rgba(52,199,89,.16);color:var(--green)}
.mhdr{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px 6px;background:var(--fill2);font-size:13px;color:var(--label2);text-transform:uppercase}
.mhdr b{color:var(--label);font-weight:600;text-transform:none}
.foot{text-align:center;color:var(--label3);font-size:11px;margin-top:8px}
</style>
</head>
<body>
<div id="ptr"><div class="spin"></div><span id="ptr-t">Pull to refresh</span></div>
<div id="scroller">
<div class="wrap">
  <div class="top">
    <button class="icb" id="hide" aria-label="Hide amounts"><svg id="eye" viewBox="0 0 24 24"></svg></button>
    <button class="icb" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <h1 id="title">2027 Portfolio</h1>
  <div class="sub" id="asof"></div>

  <section class="view setup" id="v-setup">
    <div class="t2" style="margin:0 0 4px">Paste the Apps Script link and your access key. They stay on this phone only.</div>
    <label for="in-url">Apps Script link</label>
    <input id="in-url" type="url" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="in-key">Access key</label>
    <input id="in-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="save">Connect</button>
    <button class="btn plain" id="cancel" style="display:none">Cancel</button>
    <div class="err" id="setup-err"></div>
  </section>
  <section class="view on" id="v-sum"><div class="empty">Loading…</div></section>
  <section class="view" id="v-stk"></section>
  <section class="view" id="v-acc"></section>
  <section class="view" id="v-sec"></section>
  <section class="view" id="v-inc"></section>

  <div class="foot">Holdings 2027 · v4.5</div>
</div>
</div>

<nav id="nav">
  <button class="on" data-v="sum"><svg viewBox="0 0 24 24"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h5v-5.5h3V20h5V9.5"/></svg>Home</button>
  <button data-v="stk"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r=".6"/><circle cx="4" cy="12" r=".6"/><circle cx="4" cy="18" r=".6"/></svg>Holdings</button>
  <button data-v="acc"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18"/><path d="M15.5 15h2.5"/></svg>Accounts</button>
  <button data-v="sec"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 2.6A9 9 0 0 1 21.4 9H15z"/></svg>Sectors</button>
  <button data-v="inc"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>Income</button>
</nav>

<script>
/* No portfolio numbers live in this file. They are fetched from your private Apps Script with your key. */
const CA = new Set(["AEM","ATRL","CNQ","CNR","ENB","FBTC","RY","TRI","WPM","TD","BMO","BNS","CM","SU","CP","SHOP","BN","MFC","T","BCE","ATD","L","WCN","CSU","TOU","FNV","PHYS","CCO","NA","POW","SLF","IFC","FTS","EMA","H","AQN","GIB.A","DOL","MRU","CTC.A","QSR","NTR","TRP","PPL","IMO","CVE","XEQT","VFV","XIU","ZSP"]);
const NICE = {AMZN:"Amazon.com",AEM:"Agnico Eagle Mines",ATRL:"AtkinsRéalis",CNQ:"Canadian Natural Resources",CNR:"Canadian National Railway",COST:"Costco Wholesale",ENB:"Enbridge",FBTC:"Fidelity Bitcoin ETF",GOOGL:"Alphabet",JNJ:"Johnson & Johnson",JPM:"JPMorgan Chase",LIN:"Linde",LLY:"Eli Lilly",MSFT:"Microsoft",NVDA:"NVIDIA",RY:"Royal Bank of Canada",TRI:"Thomson Reuters",V:"Visa",WPM:"Wheaton Precious Metals",TSLA:"Tesla"};
const TECH = new Set(["Information Technology","Communication Services"]);
const YEAR=2027;
const TYPES={DIVIDEND:["Dividend","var(--blue)"],INTEREST:["Interest","var(--teal)"],"CAPITAL GAIN":["Capital gain","var(--orange)"]};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let HIDE=LS.get("h27.hide")=="1";

const $=id=>document.getElementById(id);
const MASK=`<span class="mask">••••••</span>`;
const money=v=>{const [w,c]=Math.abs(v).toFixed(2).split(".");return `<span class="cur">CA</span>$${Number(w).toLocaleString("en-US")}<span class="ct">.${c}</span>`};
const fm=v=>HIDE?MASK:(v<0?"−":"")+money(v);
const fp=v=>HIDE?MASK:(v>0?"+":v<0?"−":"")+money(v);
const fprice=v=>HIDE?MASK:money(v);
const fn=v=>HIDE?MASK:v.toLocaleString("en-US");
const pc=(v,d=2)=>(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d)+"%";
const cl=v=>v>0?"up":v<0?"dn":"";
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const title=s=>String(s).toLowerCase().replace(/\b([a-z])/g,m=>m.toUpperCase());
const CHEV=`<svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5 1.5 11.5"/></svg>`;

let DATA=[],T=0,I=0,P=0,ASOF="",INC=[],NET=null;
const incOf=f=>sum(INC.filter(f),x=>x.amt);
const divOf=t=>incOf(x=>x.type=="DIVIDEND"&&x.src.toUpperCase()==t.toUpperCase());
const W=x=>x.m/T*100;
function group(key){const g={};DATA.forEach(x=>{(g[x[key]]??={k:x[key],m:0,i:0,list:[]});g[x[key]].m+=x.m;g[x[key]].i+=x.i;g[x[key]].list.push(x)});return Object.values(g).map(o=>({...o,p:o.m-o.i,r:(o.m/o.i-1)*100})).sort((a,b)=>b.m-a.m)}

function load(json){
  DATA=json.rows.filter(x=>x.i>0).map(x=>{
    let sec=title(x.sec); if(/^crypto/i.test(x.sec)) sec="Crypto";
    return {t:String(x.t),n:NICE[x.t]||title(x.n),s:Number(x.s)||0,m:x.m,i:x.i,a:String(x.a||""),sec,c:CA.has(x.t)?"CA":"US",p:x.m-x.i,r:(x.m/x.i-1)*100};
  });
  T=sum(DATA,x=>x.m); I=sum(DATA,x=>x.i); P=T-I;
  NET=json.net&&isFinite(json.net.assets)&&json.net.assets>0?json.net:null;
  INC=(json.income||[]).map(x=>({...x,d:String(x.d||""),src:String(x.src||""),a:String(x.a||""),type:String(x.type||"").toUpperCase(),amt:Number(x.amt)||0})).filter(x=>String(x.d).startsWith(String(YEAR))).sort((a,b)=>b.d.localeCompare(a.d));
  const d=new Date(json.asOf);
  ASOF="Updated "+d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
  renderAll();
}
function renderAll(){
  if(!DATA.length) return;
  $("asof").textContent=ASOF;
  const bad=[];
  [["Home",renderSummary],["Holdings",renderStocks],["Accounts",renderAccounts],["Sectors",renderSectors],["Income",renderIncome]].forEach(([n,f])=>{try{f()}catch(e){bad.push(n);console.error(n,e)}});
  if(bad.length) $("asof").textContent=ASOF+" · display problem on "+bad.join(", ");
}

function renderSummary(){
  const gain=DATA.filter(x=>x.p>0), loss=DATA.filter(x=>x.p<0);
  const G=sum(gain,x=>x.p), L=sum(loss,x=>x.p);
  const worst=[...loss].sort((a,b)=>a.p-b.p).slice(0,2);
  const worstShare=L?sum(worst,x=>x.p)/L*100:0;
  const byW=[...DATA].sort((a,b)=>b.m-a.m), byR=[...DATA].sort((a,b)=>b.r-a.r);
  const top5=sum(byW.slice(0,5),W), top10=sum(byW.slice(0,10),W);
  const big=byW[0], small=byW[byW.length-1];
  const ctry=group("c"), us=ctry.find(x=>x.k=="US")||{m:0,r:0,list:[]}, ca=ctry.find(x=>x.k=="CA")||{m:0,r:0,list:[]};
  const techList=DATA.filter(x=>TECH.has(x.sec)), tech=sum(techList,W);
  const incT=incOf(()=>true), divT=incOf(x=>x.type=="DIVIDEND");
  $("v-sum").innerHTML=`
  <div class="group pad" style="padding:16px 16px 16px">
    <div class="cap">Market value</div>
    <div class="hero">${fm(T)}</div>
    <div class="chg ${cl(P)}">${HIDE?"":fp(P)+" "}(${pc(P/I*100)})</div>
    <div class="desc">What all ${DATA.length} holdings are worth now — ${P>=0?"above":"below"} what you put in by ${pc(Math.abs(P/I*100)).replace("+","")}.</div>
  </div>
  <div class="tiles">
    <div class="tile"><span class="cap">Invested</span><b>${fm(I)}</b><div class="tdesc">Total money you put in</div></div>
    <div class="tile"><span class="cap">Holdings</span><b>${DATA.length}</b><div class="tdesc">${gain.length} up · ${loss.length} down</div></div>
    <div class="tile"><span class="cap">${gain.length} gainers</span><b class="up">${fp(G)}</b><div class="tdesc">Best: ${esc(byR[0].t)} ${pc(byR[0].r)}</div></div>
    <div class="tile"><span class="cap">${loss.length} losers</span><b class="dn">${fp(L)}</b><div class="tdesc">Worst: ${esc(byR[byR.length-1].t)} ${pc(byR[byR.length-1].r)}</div></div>
    <div class="tile"><span class="cap">Income ${YEAR}</span><b>${fm(incT)}</b><div class="tdesc">${INC.length?`${INC.length} payments so far`:"Nothing recorded yet"}</div></div>
    <div class="tile"><span class="cap">Dividend yield on cost</span><b>${(divT/I*100).toFixed(2)}%</b><div class="tdesc">Dividends ÷ invested</div></div>
  </div>
  ${worst.length?`<div class="callout"><b>${worstShare.toFixed(0)}%</b> of total losses come from <b>${worst.map(x=>esc(x.t)).join("</b> and <b>")}</b>.</div>`:""}
  <div class="hdr">Concentration</div>
  <div class="group">
    <div class="desc cell-desc">Your top 5 holdings make up ${top5.toFixed(2)}% of the portfolio. The largest, ${esc(big.t)}, is ${W(big).toFixed(2)}%.</div>
    <div class="cell"><div class="l">Top 5<div class="t3">${byW.slice(0,5).map(x=>esc(x.t)).join(" · ")}</div></div><div class="r sb">${top5.toFixed(2)}%</div></div>
    <div class="cell"><div class="l">Top 10</div><div class="r sb">${top10.toFixed(2)}%</div></div>
    <div class="cell"><div class="l">Largest</div><div class="r"><span class="t2">${esc(big.t)}</span>&nbsp; <span class="sb">${W(big).toFixed(2)}%</span></div></div>
    <div class="cell"><div class="l">Smallest</div><div class="r"><span class="t2">${esc(small.t)}</span>&nbsp; <span class="sb">${W(small).toFixed(2)}%</span></div></div>
    <div class="cell"><div class="l">Tech + Comm. Services<div class="t3">${techList.map(x=>esc(x.t)).join(" · ")}</div></div><div class="r sb">${tech.toFixed(2)}%</div></div>
  </div>
  <div class="hdr">Country</div>
  <div class="group">
    <div class="desc cell-desc">${(us.m/T*100).toFixed(2)}% is in US stocks and ${(ca.m/T*100).toFixed(2)}% in Canadian. ${us.r>ca.r?"US":"Canadian"} holdings are doing better.</div>
    <div class="pad" style="padding-top:4px;padding-bottom:4px"><div class="split"><i style="width:${us.m/T*100}%;background:var(--blue)"></i><i style="width:${ca.m/T*100}%;background:var(--orange)"></i></div></div>
    <div class="cell"><div class="l"><span class="dot" style="background:var(--blue)"></span>United States<div class="t3" style="margin-left:17px">${us.list.length} holdings</div></div><div class="r"><div class="sb">${(us.m/T*100).toFixed(2)}%</div><div class="t3 ${cl(us.r)}">${pc(us.r)}</div></div></div>
    <div class="cell"><div class="l"><span class="dot" style="background:var(--orange)"></span>Canada<div class="t3" style="margin-left:17px">${ca.list.length} holdings${ca.list.some(x=>x.t=="FBTC")?" · incl. FBTC":""}</div></div><div class="r"><div class="sb">${(ca.m/T*100).toFixed(2)}%</div><div class="t3 ${cl(ca.r)}">${pc(ca.r)}</div></div></div>
  </div>`;
}

/* Asset allocation — needs the "net" block from the Apps Script (2027 NET ASSETS sheet) */
function allocHTML(){
  if(!NET) return `
  <div class="hdr">Asset Allocation</div>
  <div class="group"><div class="desc cell-desc">Not available: this Apps Script link doesn't send the 2027 NET ASSETS numbers. Tap the gear and use the newest link (it ends in …AaAdMig/exec).</div></div>`;
  const fb=sum(DATA.filter(x=>x.t=="FBTC"),x=>x.m);
  const stocks=T-fb, gold=NET.gold||0, crypto=(NET.crypto||0)+fb;

function upcomingDivs(){
  const y=YEAR, out=[];
  const used=new Set(), divInc=INC.map((i,k)=>({...i,k})).filter(i=>i.type=="DIVIDEND");
  DATA.forEach(x=>{
    const d=DIVS[x.t.toUpperCase()]; if(!d||!x.s) return;
    const [cur,rate,dates]=d;
    dates.forEach(md=>{
      const date=`${y}-${md}`, m=Number(md.slice(0,2))-1, t0=new Date(date+"T12:00");
      const gross=x.s*rate*(cur=="USD"?FX:1);
      const wht=US_WHT.has(x.t.toUpperCase())&&/TFSA/i.test(x.a);
      const mine=divInc.filter(i=>!used.has(i.k)&&i.src.toUpperCase()==x.t.toUpperCase()&&(!i.a||!x.a||i.a.toUpperCase()==x.a.toUpperCase()));
      let got=mine.filter(i=>i.d.slice(5,7)==md.slice(0,2));
      if(!got.length) got=mine.filter(i=>Math.abs(new Date(i.d+"T12:00")-t0)<=10*864e5).slice(0,1);
      got.forEach(i=>used.add(i.k));
      const rec=got.length>0;
      out.push({t:x.t,a:x.a,s:x.s,cur,rate,wht,rec,type:"DIVIDEND",date:rec?got[0].d:date,m:rec?Number(got[0].d.slice(5,7))-1:m,est:wht?gross*0.85:gross,amt:rec?sum(got,i=>i.amt):(wht?gross*0.85:gross)});
    });
  });
  /* dividends you entered that aren't on the schedule (e.g. a special dividend) */
  divInc.filter(i=>!used.has(i.k)&&String(i.d).startsWith(String(y))).forEach(i=>out.push({t:i.src,a:i.a,rec:true,type:"DIVIDEND",date:i.d,m:Number(i.d.slice(5,7))-1,amt:i.amt}));
  /* interest and capital gains (P/L) you entered */
  INC.filter(i=>i.type!="DIVIDEND"&&String(i.d).startsWith(String(y))).forEach(i=>out.push({t:i.src,a:i.a,rec:true,type:i.type,date:i.d,m:Number(i.d.slice(5,7))-1,amt:i.amt}));
  return {y,list:out.sort((a,b)=>a.date.localeCompare(b.date)||b.amt-a.amt)};
}

  const today=new Date().toISOString().slice(0,10), next=left.find(x=>x.date>=today);

  </div>
  <div class="foot-note">${anyEst?`ESTIMATE rows: actual amounts will differ a little because of the exchange rate, foreign tax withheld, and dividend changes. Based on current dividend rates × your shares; dates are usual pay dates and may shift a few days. US$ converted at ${FX.toFixed(2)}. `:""}Green rows use the amounts you entered in the INCOME tab (dividends, interest and capital gains).</div>`;
}

/* connection */
async function fetchData(url,key){
  const r=await fetch(url+(url.includes("?")?"&":"?")+"key="+encodeURIComponent(key),{cache:"no-store"});
  const j=await r.json();
  if(j.error) throw new Error(j.error=="unauthorized"?"Wrong access key.":j.error);
  if(!Array.isArray(j.rows)||!j.rows.length) throw new Error("No holdings found in the sheet.");
  return j;
}
async function refresh(){
  const url=LS.get("h27.url"), key=LS.get("h27.key");
  if(!url||!key){openSetup(false);return}
  const cached=LS.get("h27.cache");
  if(cached&&!DATA.length){try{load(JSON.parse(cached))}catch(e){}}
  try{
    const j=await fetchData(url,key);
    LS.set("h27.cache",JSON.stringify(j)); load(j);
  }catch(e){
    if(DATA.length){$("asof").textContent=ASOF+" · couldn't refresh ("+(e.message||"error")+")"}
    else{$("v-sum").innerHTML=`<div class="empty">Couldn't load data.<div class="t3" style="margin-top:6px">${esc(e.message)}</div></div>`}
  }
}

  $("in-url").value=LS.get("h27.url")||""; $("in-key").value=LS.get("h27.key")||"";
  $("cancel").style.display=canCancel?"block":"none"; $("setup-err").textContent="";
  $("asof").textContent="";
  show("setup");
}
$("gear").onclick=()=>openSetup(!!DATA.length);
$("cancel").onclick=()=>{$("asof").textContent=ASOF;show("sum")};
$("save").onclick=async()=>{
  const url=$("in-url").value.trim(), key=$("in-key").value.trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)){$("setup-err").textContent="Paste the Apps Script link that starts with https://script.google.com/";return}
  if(!key){$("setup-err").textContent="Enter your access key.";return}
  $("save").textContent="Connecting…";
  try{
    const j=await fetchData(url,key);
    LS.set("h27.url",url); LS.set("h27.key",key); LS.set("h27.cache",JSON.stringify(j));
    load(j); show("sum");
  }catch(e){$("setup-err").textContent=e.message||"Couldn't connect. Check the link."}
  $("save").textContent="Connect";
};
/* pull down hard to refresh */
(function(){
  const sc=$("scroller"), wrap=document.querySelector(".wrap"), ind=$("ptr"), txt=$("ptr-t"), spin=ind.querySelector(".spin");
  const LIMIT=70; let y0=null, x0=0, pull=0, busy=false, vertical=null;
  const paint=d=>{wrap.style.transform=d?`translateY(${d}px)`:"";ind.style.opacity=Math.min(d/LIMIT,1);if(!busy)spin.style.transform=`rotate(${d*4}deg)`;
    if(!busy)txt.textContent=d>=LIMIT?"Release to refresh":"Pull to refresh"};
  sc.addEventListener("touchstart",e=>{if(busy||cur=="setup"||sc.scrollTop>0){y0=null;return}
    y0=e.touches[0].clientY;x0=e.touches[0].clientX;pull=0;vertical=null;wrap.style.transition=""},{passive:true});
  sc.addEventListener("touchmove",e=>{if(y0==null)return;
    const dy=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    if(vertical==null&&(Math.abs(dy)>6||Math.abs(dx)>6))vertical=Math.abs(dy)>Math.abs(dx);
    if(!vertical||dy<=0||sc.scrollTop>0){if(pull){pull=0;paint(0)}return}
    e.preventDefault(); pull=Math.min(dy*.5,120); paint(pull)},{passive:false});
  sc.addEventListener("touchend",async()=>{if(y0==null)return;y0=null;
    wrap.style.transition="transform .25s ease";
    if(pull>=LIMIT){busy=true;paint(50);spin.style.transition="none";spin.style.transform="";ind.classList.add("busy");txt.textContent="Updating…";
      const t0=Date.now(); try{await refresh()}catch(e){}
      /* always finish whole turns (at least 2) so the circle never stops part-way */
      const TURN=700, el=Date.now()-t0; await new Promise(r=>setTimeout(r,Math.max(2*TURN,Math.ceil(el/TURN)*TURN)-el));
      busy=false;ind.classList.remove("busy");txt.textContent="Updated";}
    pull=0;paint(0);requestAnimationFrame(()=>{spin.style.transition=""})},{passive:true});
})();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"&&DATA.length)refresh()});
refresh();
</script>
